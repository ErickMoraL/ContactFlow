{% extends "base.html" %}
{% block header %}
  <header class="border-b border-(--app-border) bg-(--app-surface) shadow-sm">
    <div class="mx-auto flex w-full max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
      <div class="flex items-center gap-6">
        <a href="{% url 'contact_list' %}"
           class="text-primary text-base font-semibold tracking-tight whitespace-nowrap transition hover:opacity-80 sm:text-lg">
          Contacts
        </a>
        <a href="{% url 'company_list' %}"
           class="text-primary text-base font-semibold tracking-tight whitespace-nowrap transition hover:opacity-80 sm:text-lg">
        Companies</a>
      </div>
      {% comment %} account and settings {% endcomment %}
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="relative">
          <button type="button"
                  id="user-menu-button"
                  class="focus:ring-primary flex items-center gap-2 rounded-full focus:ring-2 focus:ring-offset-2 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 class="h-6 w-6 rounded-full">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
          </button>
          <div id="user-menu"
               class="absolute right-0 z-50 mt-2 hidden w-48 rounded-xl border border-(--app-border) bg-(--app-surface) py-2 shadow-lg">
            <div class="border-b border-(--app-border) px-4 py-2">
              <p class="text-sm font-medium text-(--app-text)">{{ request.user.username }}</p>
              <p class="text-xs text-(--app-muted)">{{ request.user.email }}</p>
            </div>
            <a href="{% url 'password_change' %}"
               class="hover:bg-primary-soft hover:text-primary block px-4 py-2 text-sm text-(--app-text) transition">
              Change password
            </a>
            <a href="{% url 'profile' %}"
               class="hover:bg-primary-soft hover:text-primary block px-4 py-2 text-sm text-(--app-text) transition">
              Profile
            </a>
            <form action="{% url 'logout' %}" method="post">
              {% csrf_token %}
              <button type="submit"
                      class="block w-full px-4 py-2 text-left text-sm text-red-600 transition hover:bg-red-50">
                Logout
              </button>
            </form>
          </div>
        </div>
        <button onclick="toggleTheme()"
                class="hover:border-primary/30 hover:text-primary inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-(--app-border) text-(--app-text) transition"
                type="button"
                aria-label="Cambiar tema">
          <svg class="block h-5 w-5 dark:hidden"
               xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 24 24"
               stroke="currentColor"
               stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364-.707.707M6.343 17.657l-.707.707m12.728 0-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>
          <svg class="hidden h-5 w-5 dark:block"
               xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 24 24"
               stroke="currentColor"
               stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" />
          </svg>
        </button>
      </div>
    </div>
  </header>
{% endblock header %}
{% block extra_scripts %}
  <script>
    const button = document.getElementById("user-menu-button");
    const menu = document.getElementById("user-menu");

    if (button && menu) {
      button.addEventListener("click", () => {
        menu.classList.toggle("hidden");
      });

      document.addEventListener("click", (event) => {
        if (!button.contains(event.target) && !menu.contains(event.target)) {
          menu.classList.add("hidden");
        }
      });
    }
  </script>
{% endblock extra_scripts %}
