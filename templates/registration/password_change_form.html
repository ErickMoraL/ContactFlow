{% extends "layout.html" %}
{% block title %}
    Change password
{% endblock title %}
{% block content %}
    <div class="mx-auto mt-16 max-w-md">
        <div class="card">
            <h1 class="text-accent mb-6 text-center text-2xl font-bold">Change password</h1>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-primary w-full">Change password</button>
            </form>
        </div>
    </div>
{% endblock content %}
