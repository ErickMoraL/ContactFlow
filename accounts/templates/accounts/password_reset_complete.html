{% extends "base.html" %}
{% block title %}
  Reset password
{% endblock title %}
{% block content %}
  <section class="mx-auto max-w-xl">
    <div class="mb-6 text-center">
      <p class="muted text-sm font-medium uppercase tracking-wide">Account</p>
      <h1 class="text-accent mt-1 text-3xl font-bold">Password reset complete</h1>
      <p class="muted mt-2 text-sm">Your password has been successfully reset. You can now log in with your new password.</p>
    </div>
    <div class="card space-y-5">
      <a href="{% url 'login' %}" class="btn-primary block text-center">Log in</a>
    </div>
  </section>
{% endblock content %}
