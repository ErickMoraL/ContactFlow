{% extends "app_layout.html" %}
{% block title %}
  Password changed
{% endblock title %}
{% block content %}
  <section class="mx-auto max-w-xl">
    <div class="card items-center text-center">
      <div class="flex h-10 w-10 items-center justify-center rounded-full border border-green-200 bg-green-50 text-green-600 dark:border-green-900/50 dark:bg-green-950/40 dark:text-green-200">
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="2"
             stroke="currentColor"
             class="h-5 w-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
        </svg>
      </div>
      <div>
        <p class="muted text-sm font-medium uppercase tracking-wide">Account updated</p>
        <h1 class="text-accent mt-1 text-3xl font-bold">Password changed</h1>
        <p class="muted mt-2 text-sm">Your password was changed successfully.</p>
      </div>
      <a href="{% url 'contact_list' %}" class="btn-primary mt-2">Back to contacts</a>
    </div>
  </section>
{% endblock content %}
