{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>
      {% block title %}
        ContactFlow
      {% endblock title %}
    </title>
    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme) {
        document.documentElement.classList.toggle(
          "dark",
          savedTheme === "dark",
        );
      } else {
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.classList.toggle("dark", prefersDark);
      }
    </script>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="flex min-h-screen flex-col bg-(--app-bg) text-(--app-text)">
    <header class="flex items-center justify-between border-b p-2">
      <nav class="p-2">
        <a href="{% url 'contact_list' %}" class="text-primary text-lg">Contactos</a>
      </nav>
      <button onclick="toggleTheme()"
              class="bg-primary rounded p-2 text-white"
              type="button"
              aria-label="Cambiar tema">
        <!-- Sol -->
        <svg class="block h-5 w-5 dark:hidden"
             xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364-.707.707M6.343 17.657l-.707.707m12.728 0-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
        <!-- Luna -->
        <svg class="hidden h-5 w-5 dark:block"
             xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" />
        </svg>
      </button>
    </header>
    <main class="mx-auto w-full max-w-7xl flex-1 p-4">
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}<div class="rounded bg-green-100 p-2 text-green-800">{{ message }}</div>{% endfor %}
        </div>
      {% endif %}
      {% block content %}
      {% endblock content %}
    </main>
    <footer class="border-t p-4 text-center text-sm text-gray-500">
      &copy; 2026 Erick Morales. Todos los derechos reservados.
    </footer>
    <script>
      function toggleTheme() {
        const html = document.documentElement;
        html.classList.toggle("dark");

        const isDark = html.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }
    </script>
  </body>
</html>
